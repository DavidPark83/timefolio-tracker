name: Daily ETF Crawler

on:
  # 매 평일 오전 8시30분(KST) = UTC 23:30 (1차 시도), 지연 1시간 고려
  # 매 평일 오전 8시55분(KST) = UTC 23:55 (2차 시도, 1차 성공 시 자동 스킵)
  schedule:
    - cron: '10 22 * * 0-4'
    - cron: '20 22 * * 0-4'
    # 30 23 * * 0-4
    # │ │ │ │ └── 요일: 0(일)~4(목) UTC = 월~금 KST
    # │ │ │ └──── 월: 매월
    # │ │ └────── 일: 매일
    # │ └───────── 시: 23시 UTC
    # └──────────── 분: 30분

  # 수동 실행 (기간 지정 백필 가능)
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily       # crawler.py 실행 (오늘 또는 target_date)
          - backfill    # backfill.py 실행 (start_date ~ end_date)
      target_date:
        description: '[daily] 수집할 날짜 (YYYY-MM-DD), 빈 칸이면 오늘'
        required: false
        default: ''
      start_date:
        description: '[backfill] 시작일 (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: '[backfill] 종료일 (YYYY-MM-DD), 빈 칸이면 어제'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 백필도 충분히 끝낼 수 있게 5시간으로 확대
    # (GitHub Actions 무료 플랜은 작업당 최대 6시간 허용)
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 1) 기존 timeetf 크롤링 (변경 없음) — 반드시 먼저 완료
      # ============================================================
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          if [ "$MODE" = "backfill" ]; then
            if [ -n "$START" ] && [ -n "$END" ]; then
              echo "🔄 청크 백필: $START ~ $END"
              python backfill.py "$START" "$END"
            elif [ -n "$START" ]; then
              # 종료일 미지정 시 어제까지
              YESTERDAY=$(date -u -d 'yesterday' '+%Y-%m-%d')
              echo "🔄 백필: $START ~ $YESTERDAY"
              python backfill.py "$START" "$YESTERDAY"
            else
              echo "🔄 전체 백필: 2026-01-01 ~ 어제"
              python backfill.py
            fi
          else
            echo "📊 일일 크롤링"
            python crawler.py
          fi


      # ============================================================
      # 2) ETF 정적 페이지 생성 (기존과 동일)
      # ============================================================
      - name: Generate ETF pages
        run: |
          echo "📄 ETF 정적 페이지 생성"
          python generate_etf_pages.py

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf/ sitemap.xml
          if git diff --staged --quiet; then
            echo "변경사항 없음 - 커밋 스킵"
          else
            git commit -m "Auto-update ETF pages [skip ci]"
            git push
          fi
